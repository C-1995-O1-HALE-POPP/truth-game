<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>真心话抽题机</title>
  <style>
    :root {
      --ink: #21180f;
      --muted: #766957;
      --paper: #fff7e8;
      --paper-strong: #fff1cf;
      --red: #e9472f;
      --red-deep: #b8291b;
      --green: #165846;
      --gold: #f3ba45;
      --shadow: 0 28px 80px rgba(64, 36, 12, 0.24);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font-family: "LXGW WenKai", "STKaiti", "KaiTi", "Songti SC", serif;
      background:
        radial-gradient(circle at 18% 18%, rgba(233, 71, 47, 0.28), transparent 28%),
        radial-gradient(circle at 88% 12%, rgba(22, 88, 70, 0.22), transparent 30%),
        linear-gradient(135deg, #ffe8b6 0%, #fff7e8 48%, #f8d58d 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(33, 24, 15, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(33, 24, 15, 0.04) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black, transparent 92%);
    }

    .page {
      width: min(1120px, calc(100% - 32px));
      min-height: 100vh;
      margin: 0 auto;
      display: grid;
      place-items: center;
      padding: 56px 0;
    }

    .stage {
      position: relative;
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 0.95fr) minmax(320px, 1.05fr);
      gap: 34px;
      align-items: center;
    }

    .hero {
      position: relative;
      z-index: 1;
      padding: 40px 0;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 22px;
      padding: 9px 14px;
      border: 1px solid rgba(33, 24, 15, 0.15);
      border-radius: 999px;
      background: rgba(255, 247, 232, 0.68);
      color: var(--green);
      font-size: 15px;
      letter-spacing: 0.08em;
      backdrop-filter: blur(14px);
    }

    .eyebrow::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 16px 0 0 var(--gold), 32px 0 0 var(--green);
    }

    h1 {
      margin: 0;
      font-size: clamp(56px, 9vw, 118px);
      line-height: 0.86;
      letter-spacing: -0.07em;
      text-wrap: balance;
    }

    .subtitle {
      max-width: 560px;
      margin: 26px 0 0;
      color: var(--muted);
      font-size: clamp(18px, 2vw, 23px);
      line-height: 1.7;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 34px;
    }

    .stat {
      padding: 16px 18px;
      border: 1px solid rgba(33, 24, 15, 0.14);
      border-radius: 22px;
      background: rgba(255, 247, 232, 0.6);
      box-shadow: 0 12px 30px rgba(64, 36, 12, 0.08);
    }

    .stat strong {
      display: block;
      color: var(--red-deep);
      font-size: 28px;
      line-height: 1;
    }

    .stat span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 14px;
    }

    .card-wrap {
      position: relative;
      min-height: 610px;
      display: grid;
      place-items: center;
    }

    .halo {
      position: absolute;
      width: min(560px, 90vw);
      aspect-ratio: 1;
      border-radius: 48% 52% 45% 55%;
      background: linear-gradient(135deg, rgba(233, 71, 47, 0.22), rgba(243, 186, 69, 0.3));
      filter: blur(4px);
      animation: float 8s ease-in-out infinite;
    }

    .truth-card {
      position: relative;
      z-index: 1;
      width: min(500px, 100%);
      min-height: 560px;
      padding: 34px;
      border: 2px solid rgba(33, 24, 15, 0.18);
      border-radius: 42px;
      background:
        linear-gradient(160deg, rgba(255, 255, 255, 0.52), transparent 38%),
        var(--paper);
      box-shadow: var(--shadow);
      transform: rotate(1deg);
    }

    .truth-card::before,
    .truth-card::after {
      content: "";
      position: absolute;
      border: 2px solid rgba(33, 24, 15, 0.12);
      border-radius: 36px;
      pointer-events: none;
    }

    .truth-card::before { inset: 14px; }
    .truth-card::after { inset: 24px; border-style: dashed; }

    .card-top {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      color: var(--green);
      font-size: 15px;
      letter-spacing: 0.12em;
    }

    .seal {
      display: grid;
      place-items: center;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: var(--red);
      color: #fff7e8;
      font-size: 28px;
      font-weight: 700;
      box-shadow: 0 12px 22px rgba(184, 41, 27, 0.28);
      transform: rotate(-12deg);
    }

    .question-box {
      position: relative;
      z-index: 1;
      min-height: 255px;
      display: grid;
      place-items: center;
      margin: 62px 0 30px;
      padding: 28px;
      border-radius: 30px;
      background: var(--paper-strong);
      box-shadow: inset 0 0 0 1px rgba(33, 24, 15, 0.09);
      transition: transform 0.28s ease, filter 0.28s ease;
    }

    .question-box.is-spinning {
      transform: scale(0.985) rotate(-1deg);
      filter: blur(0.4px);
    }

    #question {
      margin: 0;
      font-size: clamp(31px, 5vw, 48px);
      line-height: 1.24;
      text-align: center;
      letter-spacing: -0.03em;
      text-wrap: balance;
    }

    .controls {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 14px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 24px;
      padding: 18px 22px;
      color: #fff7e8;
      background: linear-gradient(135deg, var(--red), var(--red-deep));
      font: inherit;
      font-size: 22px;
      cursor: pointer;
      box-shadow: 0 16px 30px rgba(184, 41, 27, 0.28);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    button:hover { transform: translateY(-2px); box-shadow: 0 20px 36px rgba(184, 41, 27, 0.32); }
    button:active { transform: translateY(1px) scale(0.99); }
    button:disabled { cursor: wait; opacity: 0.72; transform: none; }

    .history {
      min-height: 62px;
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.5;
      text-align: center;
    }

    .ribbon {
      position: absolute;
      right: -12px;
      bottom: 38px;
      z-index: 2;
      padding: 10px 18px;
      border-radius: 999px;
      background: var(--green);
      color: #fff7e8;
      font-size: 15px;
      box-shadow: 0 14px 28px rgba(22, 88, 70, 0.24);
      transform: rotate(-4deg);
    }

    @keyframes float {
      0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg); }
      50% { transform: translate3d(0, -18px, 0) rotate(8deg); }
    }

    @media (max-width: 860px) {
      .page { padding: 34px 0; }
      .stage { grid-template-columns: 1fr; gap: 10px; }
      .hero { padding: 10px 0 0; }
      .card-wrap { min-height: auto; }
      .truth-card { min-height: 520px; transform: none; }
      .ribbon { right: 18px; bottom: 20px; }
    }

    @media (max-width: 520px) {
      .page { width: min(100% - 20px, 1120px); }
      .truth-card { padding: 24px; border-radius: 32px; }
      .question-box { margin-top: 44px; padding: 20px; }
      .seal { width: 54px; height: 54px; font-size: 24px; }
      button { font-size: 20px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="stage" aria-labelledby="title">
      <div class="hero">
        <p class="eyebrow">今晚只问真心话</p>
        <h1 id="title">真心话<br>抽题机</h1>
        <p class="subtitle">点一下抽签，从 200 个问题里随机挑一个。适合朋友局、深夜聊天、破冰和“突然想更了解你”的时刻。</p>
        <div class="stats" aria-label="题库信息">
          <div class="stat"><strong id="totalCount">200</strong><span>题目收录</span></div>
          <div class="stat"><strong id="drawCount">0</strong><span>本轮已抽</span></div>
          <div class="stat"><strong>∞</strong><span>可以反复玩</span></div>
        </div>
      </div>

      <div class="card-wrap">
        <div class="halo" aria-hidden="true"></div>
        <article class="truth-card" aria-live="polite">
          <div class="card-top">
            <span>TRUTH CARD</span>
            <span class="seal">真</span>
          </div>
          <div class="question-box" id="questionBox">
            <p id="question">准备好了吗？抽一个真心话。</p>
          </div>
          <div class="controls">
            <button id="drawButton" type="button">随机抽一个</button>
            <p class="history" id="history">还没有抽题。第一题会不会刚好问到心里？</p>
          </div>
        </article>
        <span class="ribbon">抽完不重复，抽尽自动重置</span>
      </div>
    </section>
  </main>

    const question = document.querySelector('#question');
    const questionBox = document.querySelector('#questionBox');
    const drawButton = document.querySelector('#drawButton');
    const drawCount = document.querySelector('#drawCount');
    const totalCount = document.querySelector('#totalCount');
    const history = document.querySelector('#history');
    let remaining = [...prompts];
    let drawn = 0;
    let lastPrompt = '';

    totalCount.textContent = prompts.length;

    function pickPrompt() {
      if (remaining.length === 0) {
        remaining = [...prompts];
        drawn = 0;
      }

      const index = Math.floor(Math.random() * remaining.length);
      const [picked] = remaining.splice(index, 1);
      drawn += 1;
      return picked;
    }

    function draw() {
      drawButton.disabled = true;
      questionBox.classList.add('is-spinning');

      let ticks = 0;
      const spinner = window.setInterval(() => {
        question.textContent = prompts[Math.floor(Math.random() * prompts.length)];
        ticks += 1;

        if (ticks >= 12) {
          window.clearInterval(spinner);
          const picked = pickPrompt();
          question.textContent = picked;
          drawCount.textContent = drawn;
          history.textContent = lastPrompt ? `上一题：${lastPrompt}` : '第一题已出，认真回答就算赢。';
          lastPrompt = picked;
          questionBox.classList.remove('is-spinning');
          drawButton.disabled = false;
        }
      }, 55);
    }

    drawButton.addEventListener('click', draw);
  </script>
